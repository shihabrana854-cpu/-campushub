<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusHub Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{height:70px;background:#0f172a;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.logo{font-size:22px;font-weight:bold}.logo b{color:#60a5fa}.logout{background:#ef4444;color:white;border:0;padding:9px 15px;border-radius:7px}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:25px 0}.box,.panel{background:white;padding:24px;border-radius:15px;box-shadow:0 7px 25px #0001}.num{font-size:32px;color:#2563eb;font-weight:bold}.tools{display:flex;gap:10px;margin-bottom:18px}.tools input{flex:1;padding:12px;border:1px solid #d0d5dd;border-radius:8px}.btn{background:#2563eb;color:white;border:0;padding:12px 17px;border-radius:8px;font-weight:bold}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:14px;border-bottom:1px solid #eee}th{background:#f8fafc;font-size:12px}.table{overflow:auto}.del{background:#fee2e2;color:#b91c1c;border:0;padding:7px;border-radius:6px}.form{display:none;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.grid input,.grid select{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid #ddd;border-radius:8px}.empty{text-align:center;padding:20px;color:#64748b;display:none}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}.tools{flex-direction:column}}</style></head>
<body><div class="top"><div class="logo">Campus<b>Hub</b> 🎓</div><button class="logout" onclick="location.href='login.html'">Logout</button></div>
<div class="wrap"><p>ADMIN DASHBOARD</p><h1>Welcome to CampusHub 👋</h1><p>Manage student records easily.</p>
<div class="stats"><div class="box"><div class="num" id="total">0</div>Total Students</div><div class="box"><div class="num" id="deps">0</div>Departments</div><div class="box"><div class="num" id="avg">0</div>Average Age</div></div>
<div class="panel"><div class="tools"><input id="search" placeholder="🔎 Search student..."><button class="btn" onclick="form.style.display=form.style.display==='block'?'none':'block'">+ Add Student</button></div>
<div class="table"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Semester</th><th>Age</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">No students found.</div></div>
<form class="form" id="form"><div class="grid"><label>ID<input id="sid" required></label><label>Name<input id="name" required></label><label>Department<select id="dep" required><option value="">Select</option><option>CSE</option><option>EEE</option><option>BBA</option><option>Civil</option><option>English</option></select></label><label>Semester<input id="sem" placeholder="4th" required></label><label>Age<input id="age" type="number" min="10" max="100" required></label></div><button class="btn">Save Student</button></form></div></div>
<script>
let students=JSON.parse(localStorage.getItem("campusHub"))||[{id:"1001",name:"Rahim Ahmed",dep:"CSE",sem:"4th",age:21},{id:"1002",name:"Nusrat Jahan",dep:"BBA",sem:"2nd",age:20},{id:"1003",name:"Sakib Hasan",dep:"EEE",sem:"6th",age:22},{id:"1004",name:"Mim Akter",dep:"CSE",sem:"3rd",age:20}];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function save(){localStorage.setItem("campusHub",JSON.stringify(students))}
function render(a=students){rows.innerHTML="";empty.style.display=a.length?"none":"block";a.forEach(x=>{let i=students.indexOf(x),r=document.createElement("tr");r.innerHTML=`<td>${esc(x.id)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.dep)}</td><td>${esc(x.sem)}</td><td>${x.age}</td><td><button class="del" onclick="removeStudent(${i})">Delete</button></td>`;rows.appendChild(r)});total.textContent=students.length;deps.textContent=new Set(students.map(x=>x.dep)).size;avg.textContent=students.length?(students.reduce((a,x)=>a+Number(x.age),0)/students.length).toFixed(1):0}
function removeStudent(i){if(confirm("Delete this student?")){students.splice(i,1);save();render()}}
search.oninput=e=>{let q=e.target.value.toLowerCase();render(students.filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q))))}
form.onsubmit=e=>{e.preventDefault();let x={id:sid.value.trim(),name:name.value.trim(),dep:dep.value,sem:sem.value.trim(),age:Number(age.value)};if(students.some(y=>y.id===x.id))return alert("Student ID already exists.");students.push(x);save();render();form.reset();form.style.display="none"};render();
</script></body></html>
