<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusHub Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#2563eb,#4f46e5);min-height:100vh;display:grid;place-items:center}.card{background:white;width:min(420px,92%);padding:38px;border-radius:20px;box-shadow:0 25px 70px #0004}.logo{text-align:center;font-size:30px;font-weight:800}.logo b{color:#2563eb}.sub{text-align:center;color:#667085;margin:8px 0 28px}label{display:block;font-weight:bold;font-size:13px;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:9px}button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}.demo{text-align:center;background:#f8fafc;padding:11px;margin-top:17px;font-size:12px;color:#667085}.msg{text-align:center;margin-top:12px;font-size:13px;font-weight:bold}</style></head>
<body><div class="card"><div class="logo">Campus<b>Hub</b> 🎓</div><div class="sub">Student Management System</div>
<form id="f"><label>Email</label><input id="email" type="email" placeholder="admin@campushub.com" required><label>Password</label><input id="pass" type="password" placeholder="123456" required><button>Login to Dashboard →</button></form>
<div class="demo">Demo: <b>admin@campushub.com</b> / <b>123456</b></div><div class="msg" id="msg"></div></div>
<script>f.onsubmit=e=>{e.preventDefault();if(email.value==="admin@campushub.com"&&pass.value==="123456"){msg.style.color="green";msg.textContent="Login successful!";setTimeout(()=>location.href="dashboard.html",400)}else{msg.style.color="red";msg.textContent="Invalid email or password."}}</script></body></html>
